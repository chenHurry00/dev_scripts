site_name: DockerHub Manager 文档中心
site_description: DockerHub Manager 分配员与用户操作文档
site_url: ""
use_directory_urls: true
not_in_nav: |
  assets/images/README.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 分配员手册:
      - 总览: allocator/index.md
  - 用户手册:
      - 总览: user/index.md
  - GPU用量说明:
      - 总览: gpu/index.md
  - 常见问题:
      - FAQ: faq/index.md
