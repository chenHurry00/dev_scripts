<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU 计算时门户</title>
<style>
:root {
  --bg: #0b1017;
  --panel: #121a24;
  --panel-2: #172231;
  --border: #223247;
  --text: #e8edf3;
  --muted: #87a0bb;
  --low: #4f657d;
  --accent: #00d4ff;
  --ok: #00e5a0;
  --warn: #ffaa00;
  --danger: #ff5566;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 "JetBrains Mono", monospace;
}
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 18px;
}
.title {
  font-size: 28px;
  font-weight: 700;
}
.sub {
  color: var(--muted);
  font-size: 12px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.card, .panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.card {
  padding: 16px;
}
.label {
  color: var(--muted);
  font-size: 12px;
}
.value {
  margin-top: 8px;
  font-size: 28px;
  font-weight: 700;
}
.value.small {
  font-size: 22px;
}
.panel {
  padding: 16px;
  margin-bottom: 18px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.panel-title {
  font-size: 18px;
  font-weight: 700;
}
.hint {
  color: var(--muted);
  font-size: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
th {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
tr:last-child td {
  border-bottom: none;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.badge.ok { color: var(--ok); border-color: rgba(0,229,160,.35); }
.badge.warn { color: var(--warn); border-color: rgba(255,170,0,.35); }
.badge.danger { color: var(--danger); border-color: rgba(255,85,102,.35); }
.badge.info { color: var(--accent); border-color: rgba(0,212,255,.35); }
.runtime-server-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
.runtime-server-card {
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  display: grid;
  gap: 12px;
  min-width: 0;
}
.runtime-server-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.runtime-server-title {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}
.runtime-server-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.runtime-ring-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 18px;
  align-items: flex-start;
}
.runtime-ring {
  --ring-color: var(--accent);
  --ring-glow: rgba(0, 212, 255, 0.18);
  --ring-glow-outer: rgba(0, 212, 255, 0.12);
  --ring-progress: 0%;
  width: 104px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: none;
  background: transparent;
  padding: 0;
  color: inherit;
  font: inherit;
}
.runtime-ring.ok {
  --ring-color: var(--ok);
  --ring-glow: rgba(0, 229, 160, 0.18);
  --ring-glow-outer: rgba(0, 229, 160, 0.12);
}
.runtime-ring.warn {
  --ring-color: var(--warn);
  --ring-glow: rgba(255, 170, 0, 0.28);
  --ring-glow-outer: rgba(255, 170, 0, 0.16);
}
.runtime-ring.danger {
  --ring-color: var(--danger);
  --ring-glow: rgba(255, 85, 102, 0.3);
  --ring-glow-outer: rgba(255, 85, 102, 0.18);
}
.runtime-ring.muted {
  --ring-color: var(--accent);
  --ring-glow: rgba(0, 212, 255, 0.14);
  --ring-glow-outer: rgba(0, 212, 255, 0.1);
}
.runtime-ring-visual {
  position: relative;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: conic-gradient(from -90deg, var(--ring-color) var(--ring-progress), rgba(255,255,255,0.06) 0);
  box-shadow:
    0 0 10px var(--ring-glow),
    0 0 18px var(--ring-glow-outer),
    inset 0 0 0 1px rgba(255,255,255,0.04);
}
.runtime-ring-visual::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(12,16,24,0.98), rgba(18,26,38,0.96));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.05),
    0 0 8px rgba(0,0,0,0.16);
}
.runtime-ring-core {
  position: absolute;
  inset: 10px;
  z-index: 1;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px;
  text-align: center;
}
.runtime-ring-value {
  font-size: 21px;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.runtime-ring-label {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.1;
  white-space: nowrap;
}
.runtime-ring-subtitle {
  width: 100%;
  text-align: center;
  color: var(--low);
  font-size: 11px;
  line-height: 1.35;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.runtime-ring-toggle {
  cursor: pointer;
}
.runtime-ring-toggle:hover .runtime-ring-core,
.runtime-ring-toggle:hover .runtime-ring-visual::before {
  box-shadow:
    inset 0 0 0 1px rgba(0,212,255,0.26),
    0 0 10px rgba(0,212,255,0.1);
}
.chart {
  width: 100%;
  min-height: 260px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-2);
  padding: 12px;
}
.empty {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}
.mono {
  font-variant-numeric: tabular-nums;
}
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 640px) {
  .wrap {
    padding: 14px;
  }
  .head {
    flex-direction: column;
    align-items: flex-start;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  .value {
    font-size: 24px;
  }
  .runtime-server-grid {
    grid-template-columns: 1fr;
  }
  .runtime-ring {
    width: 90px;
  }
  .runtime-ring-visual {
    width: 78px;
    height: 78px;
  }
  .runtime-ring-visual::before {
    inset: 2px;
  }
  .runtime-ring-core {
    inset: 8px;
    padding: 5px;
  }
  .runtime-ring-value {
    font-size: 18px;
  }
  .runtime-ring-label {
    font-size: 10px;
  }
  .runtime-ring-subtitle {
    font-size: 10px;
  }
  table, thead, tbody, th, td, tr {
    display: block;
  }
  thead {
    display: none;
  }
  tr {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 10px;
    padding: 8px;
    background: var(--panel-2);
  }
  td {
    border: none;
    padding: 4px 0;
  }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="title">GPU 计算时门户</div>
        <div class="sub">用户：{{ portal_username }} ·  {{ retention_days }} 天 · v{{ panel_version }}</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">最近30天 GPU卡时</div>
        <div class="value mono" id="ov-hours">—</div>
      </div>
      <div class="card">
        <div class="label">本周已用 / 有效额度</div>
        <div class="value mono" id="ov-rank">—</div>
      </div>
      <div class="card">
        <div class="label">本周超额量</div>
        <div class="value small mono" id="ov-quota">—</div>
      </div>
      <div class="card">
        <div class="label">配额状态</div>
        <div class="value small" id="ov-status">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">服务器状态</div>
          <div class="hint" id="runtime-last-sample">—</div>
        </div>
      </div>
      <div class="grid">
        <div class="card">
          <div class="label">在线 GPU 服务器</div>
          <div class="value mono" id="rt-online">—</div>
        </div>
        <div class="card">
          <div class="label">空闲 GPU / 总 GPU</div>
          <div class="value mono" id="rt-idle">—</div>
        </div>
        <div class="card">
          <div class="label">资源紧张服务器</div>
          <div class="value mono" id="rt-tight">—</div>
        </div>
        <div class="card">
          <div class="label">状态过期服务器</div>
          <div class="value mono" id="rt-expired">—</div>
        </div>
      </div>
      <div class="runtime-server-grid" id="runtime-server-grid"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">用量曲线</div>
          <div class="hint" id="chart-window">—</div>
        </div>
      </div>
      <div id="daily-chart" class="chart"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">最近 30 天用量</div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>排名</th>
            <th>用户</th>
            <th>30天 GPU卡时</th>
            <th>本周已用 / 有效额度</th>
            <th>本周超额量</th>
            <th>低效占用</th>
            <th>平均 GPU%</th>
            <th>峰值活跃 GPU</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </div>
  </div>

<script>
const PORTAL_TOKEN = {{ portal_token|tojson }};
const RUNTIME_GPU_COLLAPSED_COUNT = 4;
const PORTAL_RUNTIME_EXPANDED_GPU = {};

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

function formatHours(value, withUnit = true) {
  const num = Number(value);
  if (!Number.isFinite(num)) return '—';
  const digits = num >= 100 ? 0 : (num >= 10 ? 1 : 2);
  return `${num.toFixed(digits)}${withUnit ? ' h' : ''}`;
}

function formatPercent(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return '—';
  return `${num >= 10 ? num.toFixed(0) : num.toFixed(1)}%`;
}

function formatBytesCompact(bytes) {
  const value = Number(bytes);
  if (!Number.isFinite(value) || value < 0) return '—';
  if (value === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let size = value;
  let index = 0;
  while (size >= 1024 && index < units.length - 1) {
    size /= 1024;
    index += 1;
  }
  const digits = size >= 100 || index === 0 ? 0 : 1;
  return `${size.toFixed(digits)} ${units[index]}`;
}

function formatBytesPair(usedBytes, totalBytes) {
  const total = Number(totalBytes || 0);
  const used = Number(usedBytes || 0);
  if (!Number.isFinite(total) || total <= 0) {
    return formatBytesCompact(used);
  }
  return `${formatBytesCompact(used)} / ${formatBytesCompact(total)}`;
}

function formatDateTimeText(value) {
  const text = String(value || '').trim();
  if (!text) return '—';
  return text.slice(0, 19).replace('T', ' ');
}

function quotaBadge(status) {
  const map = {
    normal: ['ok', '正常'],
    warn: ['warn', '预警'],
    over: ['danger', '超额'],
    critical: ['danger', '严重超额']
  };
  const item = map[status] || ['info', status || '未知'];
  return `<span class="badge ${item[0]}">${item[1]}</span>`;
}

function runtimeBadge(status) {
  if (!status) {
    return '<span class="badge info">采集中</span>';
  }
  const map = {
    trainable: ['ok', '可训练'],
    tight: ['warn', '资源紧张'],
    expired: ['danger', '状态过期']
  };
  const item = map[status] || ['danger', '状态过期'];
  return `<span class="badge ${item[0]}">${item[1]}</span>`;
}

async function portalApi(path) {
  const response = await fetch(path);
  return response.json();
}

function clampRuntimePercent(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return 0;
  return Math.max(0, Math.min(100, num));
}

function formatRuntimeFraction(current, total) {
  const currentValue = Math.max(0, Number(current || 0));
  const totalValue = Math.max(0, Number(total || 0));
  return `${Math.round(currentValue)}/${Math.round(totalValue)}`;
}

function runtimeGpuDeviceState(device) {
  const util = Number(device && device.utilization_gpu || 0);
  const memoryPercent = Number(device && device.memory_usage_percent || 0);
  if (util > 90 || memoryPercent > 90) return 'danger';
  if (util > 60 || memoryPercent > 60) return 'warn';
  return 'ok';
}

function runtimeGpuDeviceScore(device) {
  const util = Number(device && device.utilization_gpu || 0);
  const memoryPercent = Number(device && device.memory_usage_percent || 0);
  const activeBias = device && device.active ? 1000 : 0;
  return activeBias + Math.max(util, memoryPercent);
}

function sortRuntimeGpuDevices(devices) {
  return [...(Array.isArray(devices) ? devices : [])].sort((left, right) => {
    const diff = runtimeGpuDeviceScore(right) - runtimeGpuDeviceScore(left);
    if (diff !== 0) return diff;
    return String(left && left.id || '').localeCompare(String(right && right.id || ''), 'zh-CN', { numeric: true });
  });
}

function renderRuntimeRing(metric) {
  const tag = metric.toggle ? 'button' : 'div';
  const toggleAttr = metric.toggle ? ` type="button" data-runtime-gpu-toggle="${escapeHtml(metric.serverId || '')}"` : '';
  const toggleClass = metric.toggle ? ' runtime-ring-toggle' : '';
  return `<${tag} class="runtime-ring ${metric.state || 'muted'}${toggleClass}"${toggleAttr} style="--ring-progress:${clampRuntimePercent(metric.progress).toFixed(1)}%">
    <div class="runtime-ring-visual">
      <div class="runtime-ring-core">
        <div class="runtime-ring-value">${escapeHtml(metric.value || '—')}</div>
        <div class="runtime-ring-label">${escapeHtml(metric.label || '')}</div>
      </div>
    </div>
    <div class="runtime-ring-subtitle">${escapeHtml(metric.subtitle || '—')}</div>
  </${tag}>`;
}

function buildRuntimeMetrics(item) {
  const runtime = item && item.runtime ? item.runtime : {};
  if (!runtime || (!runtime.sampled_at && !runtime.error)) {
    return [{
      value: '—',
      label: '运行状态',
      subtitle: '等待采样',
      progress: 0,
      state: 'muted'
    }];
  }
  const cpu = runtime.cpu || {};
  const memory = runtime.memory || {};
  const gpu = runtime.gpu || {};
  const storage = runtime.storage || {};
  const workspace = storage.workspace || {};
  const metrics = [
    {
      value: formatPercent(cpu.usage_percent || 0),
      label: 'CPU',
      subtitle: `Load ${Number(cpu.load1 || 0).toFixed(1)} / ${cpu.cores || '—'}核`,
      progress: cpu.usage_percent || 0,
      state: cpu.state || 'muted'
    },
    {
      value: formatPercent(memory.usage_percent || 0),
      label: '内存',
      subtitle: formatBytesPair(memory.used_bytes || 0, memory.total_bytes || 0),
      progress: memory.usage_percent || 0,
      state: memory.state || memory.overall_state || 'muted'
    },
    {
      value: formatPercent(memory.swap_usage_percent || 0),
      label: 'SWAP',
      subtitle: Number(memory.swap_total_bytes || 0) > 0
        ? formatBytesPair(memory.swap_used_bytes || 0, memory.swap_total_bytes || 0)
        : '未启用',
      progress: Number(memory.swap_total_bytes || 0) > 0 ? (memory.swap_usage_percent || 0) : 0,
      state: memory.swap_state || 'ok'
    }
  ];

  const dockerRoot = storage.docker_root || {};
  metrics.push({
    value: formatPercent(dockerRoot.usage_percent || 0),
    label: 'Docker',
    subtitle: Number(dockerRoot.total_bytes || 0) > 0
      ? formatBytesPair(dockerRoot.used_bytes || 0, dockerRoot.total_bytes || 0)
      : '未检测到',
    progress: dockerRoot.usage_percent || 0,
    state: dockerRoot.state || 'muted'
  });

  metrics.push({
    value: formatPercent(workspace.usage_percent || 0),
    label: '工作区',
    subtitle: Number(workspace.count || 0) > 1
      ? `${workspace.count} 挂载点 | 空闲 ${formatBytesCompact(workspace.free_bytes || 0)}`
      : (Number(workspace.total_bytes || 0) > 0 ? formatBytesPair(workspace.used_bytes || 0, workspace.total_bytes || 0) : '未配置'),
    progress: workspace.usage_percent || 0,
    state: workspace.state || 'ok'
  });

  if (Number(gpu.device_count || 0) > 0) {
    metrics.push({
      value: formatRuntimeFraction(gpu.active_device_count || 0, gpu.device_count || 0),
      label: 'GPU汇总',
      subtitle: `VRAM ${formatBytesPair(gpu.used_memory_bytes || 0, gpu.total_memory_bytes || 0)}`,
      progress: Number(gpu.device_count || 0) > 0 ? (Number(gpu.active_device_count || 0) / Number(gpu.device_count || 1)) * 100 : 0,
      state: gpu.state || 'ok'
    });
    const devices = sortRuntimeGpuDevices(gpu.devices || []);
    const expanded = !!PORTAL_RUNTIME_EXPANDED_GPU[item.id];
    const visibleDevices = expanded ? devices : devices.slice(0, RUNTIME_GPU_COLLAPSED_COUNT);
    visibleDevices.forEach(device => {
      metrics.push({
        value: formatPercent(device.utilization_gpu || 0),
        label: `GPU-${device.id || '?'}`,
        subtitle: formatBytesPair(device.memory_used_bytes || 0, device.memory_total_bytes || 0),
        progress: Math.max(Number(device.utilization_gpu || 0), Number(device.memory_usage_percent || 0)),
        state: runtimeGpuDeviceState(device)
      });
    });
    if (!expanded && devices.length > RUNTIME_GPU_COLLAPSED_COUNT) {
      metrics.push({
        value: `+${devices.length - RUNTIME_GPU_COLLAPSED_COUNT}`,
        label: 'GPU',
        subtitle: '展开全部',
        progress: 0,
        state: 'muted',
        toggle: true,
        serverId: item.id
      });
    } else if (expanded && devices.length > RUNTIME_GPU_COLLAPSED_COUNT) {
      metrics.push({
        value: '收起',
        label: 'GPU',
        subtitle: `已展开 ${devices.length} 张`,
        progress: 0,
        state: 'muted',
        toggle: true,
        serverId: item.id
      });
    }
  } else {
    metrics.push({
      value: '0',
      label: 'GPU',
      subtitle: '无可用设备',
      progress: 0,
      state: 'warn'
    });
  }

  return metrics;
}

function renderRuntimeCard(item) {
  const runtime = item.runtime || {};
  const subtitle = runtime.sampled_at
    ? `最近采样 ${formatDateTimeText(runtime.sampled_at)}`
    : (runtime.error || '等待采样');
  return `<div class="runtime-server-card">
    <div class="runtime-server-head">
      <div>
        <div class="runtime-server-title">${escapeHtml(item.name || '—')}</div>
        <div class="runtime-server-meta">${escapeHtml(subtitle)}</div>
      </div>
      <div>${runtimeBadge(runtime.status)}</div>
    </div>
    <div class="runtime-ring-grid">${buildRuntimeMetrics(item).map(renderRuntimeRing).join('')}</div>
  </div>`;
}

function togglePortalRuntimeGpu(serverId) {
  const key = String(serverId || '').trim();
  if (!key) return;
  PORTAL_RUNTIME_EXPANDED_GPU[key] = !PORTAL_RUNTIME_EXPANDED_GPU[key];
  if (window.__portalRuntimePayload) {
    renderRuntime(window.__portalRuntimePayload);
  }
}

function renderRuntime(runtimePayload) {
  window.__portalRuntimePayload = runtimePayload;
  const summary = (runtimePayload && runtimePayload.summary) || {};
  const servers = Array.isArray(runtimePayload && runtimePayload.servers) ? runtimePayload.servers : [];
  document.getElementById('rt-online').textContent = `${summary.fresh_server_count || 0} / ${summary.server_count || 0}`;
  document.getElementById('rt-idle').textContent = `${summary.idle_gpu_count || 0} / ${summary.total_gpu_count || 0}`;
  document.getElementById('rt-tight').textContent = String(summary.tight_server_count || 0);
  document.getElementById('rt-expired').textContent = String(summary.expired_server_count || 0);
  document.getElementById('runtime-last-sample').textContent = summary.last_sample_at
    ? `最近采样 ${formatDateTimeText(summary.last_sample_at)}`
    : '暂无可用采样';
  const container = document.getElementById('runtime-server-grid');
  if (!servers.length) {
    container.innerHTML = '<div class="card"><div class="empty">暂无 GPU 服务器运行状态。</div></div>';
    return;
  }
  container.innerHTML = servers.map(renderRuntimeCard).join('');
}

document.addEventListener('click', event => {
  const toggle = event.target.closest('[data-runtime-gpu-toggle]');
  if (!toggle) return;
  togglePortalRuntimeGpu(toggle.getAttribute('data-runtime-gpu-toggle'));
});

function renderChart(series, windowStart, windowEnd) {
  const container = document.getElementById('daily-chart');
  document.getElementById('chart-window').textContent = `${windowStart} 至 ${windowEnd}`;
  const points = Array.isArray(series) ? series : [];
  if (!points.length) {
    container.innerHTML = '<div class="empty">暂无最近 30 天曲线数据</div>';
    return;
  }
  const width = 960;
  const height = 260;
  const padding = { top: 16, right: 16, bottom: 28, left: 48 };
  const chartWidth = width - padding.left - padding.right;
  const chartHeight = height - padding.top - padding.bottom;
  const values = points.map(item => Number(item.gpu_card_hours || 0));
  const max = Math.max(...values, 1);
  const step = points.length > 1 ? chartWidth / (points.length - 1) : chartWidth;
  const coords = points.map((item, index) => {
    const value = Number(item.gpu_card_hours || 0);
    return {
      x: padding.left + step * index,
      y: padding.top + chartHeight - (value / max) * chartHeight,
      date: item.date,
      value
    };
  });
  const path = coords.map((point, index) => `${index === 0 ? 'M' : 'L'}${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(' ');
  const area = `${path} L${(padding.left + chartWidth).toFixed(2)} ${(padding.top + chartHeight).toFixed(2)} L${padding.left.toFixed(2)} ${(padding.top + chartHeight).toFixed(2)} Z`;
  const grid = [0, 0.25, 0.5, 0.75, 1].map(ratio => {
    const y = padding.top + chartHeight - chartHeight * ratio;
    return { y, label: (max * ratio).toFixed(max >= 10 ? 0 : 1) };
  });
  const xLabels = coords.filter((_, index) => index === 0 || index === coords.length - 1 || index % 5 === 0);
  container.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="260" preserveAspectRatio="none">
      ${grid.map(line => `
        <line x1="${padding.left}" y1="${line.y.toFixed(2)}" x2="${(padding.left + chartWidth).toFixed(2)}" y2="${line.y.toFixed(2)}" stroke="var(--border)" stroke-width="1"></line>
        <text x="${padding.left - 8}" y="${(line.y + 4).toFixed(2)}" text-anchor="end" fill="var(--low)" font-size="10">${escapeHtml(line.label)}</text>
      `).join('')}
      <path d="${area}" fill="rgba(0,212,255,.12)"></path>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      ${coords.map(point => `
        <circle cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="2.5" fill="var(--accent)">
          <title>${escapeHtml(point.date)}: ${escapeHtml(formatHours(point.value))}</title>
        </circle>
      `).join('')}
      ${xLabels.map(point => `
        <text x="${point.x.toFixed(2)}" y="${height - 8}" text-anchor="middle" fill="var(--low)" font-size="10">${escapeHtml(point.date.slice(5))}</text>
      `).join('')}
    </svg>
  `;
}

function renderRanking(ranking) {
  const tbody = document.getElementById('ranking-body');
  const rows = Array.isArray(ranking) ? ranking : [];
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8">暂无排名数据</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(item => `
    <tr>
      <td class="mono">#${escapeHtml(String(item.rank || '—'))}</td>
      <td>${escapeHtml(item.display_name || '—')}${item.is_self ? ' <span class="badge info">本人</span>' : ''}</td>
      <td class="mono">${escapeHtml(formatHours(item.gpu_card_hours))}</td>
      <td class="mono">${escapeHtml(formatHours(item.weekly_gpu_card_hours || 0))} / ${escapeHtml(formatHours(item.effective_quota_hours || 0))}</td>
      <td class="mono">${escapeHtml(formatHours(item.weekly_over_quota_hours || 0))}</td>
      <td class="mono">${escapeHtml(formatHours(item.low_efficiency_card_hours))}</td>
      <td class="mono">${escapeHtml(formatPercent(item.avg_gpu_util_percent || 0))}</td>
      <td class="mono">${escapeHtml(String(item.peak_active_gpu_count || 0))}</td>
    </tr>
  `).join('');
}

async function loadPortal() {
  const [me, ranking, runtime] = await Promise.all([
    portalApi(`/portal-api/me/${encodeURIComponent(PORTAL_TOKEN)}?days=30`),
    portalApi(`/portal-api/ranking/${encodeURIComponent(PORTAL_TOKEN)}?days=30`),
    portalApi(`/portal-api/runtime/${encodeURIComponent(PORTAL_TOKEN)}`)
  ]);
  if (!me.ok) {
    document.body.innerHTML = `<div class="wrap"><div class="panel"><div class="empty">${escapeHtml(me.error || '读取失败')}</div></div></div>`;
    return;
  }
  document.getElementById('ov-hours').textContent = formatHours(me.me.gpu_card_hours || 0, false);
  document.getElementById('ov-rank').textContent = `${formatHours(me.me.weekly_gpu_card_hours || 0)} / ${formatHours(me.me.effective_quota_hours || 0)}`;
  document.getElementById('ov-quota').textContent = formatHours(me.me.weekly_over_quota_hours || 0);
  document.getElementById('ov-status').innerHTML = quotaBadge(me.me.quota_status);
  renderRuntime(runtime);
  renderChart((me.daily && me.daily.series) || [], me.window_start, me.window_end);
  renderRanking((ranking && ranking.ranking) || []);
}

loadPortal();
</script>
