<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU 计算时门户</title>
<style>
:root {
  --bg: #0b1017;
  --panel: #121a24;
  --panel-2: #172231;
  --border: #223247;
  --text: #e8edf3;
  --muted: #87a0bb;
  --low: #4f657d;
  --accent: #00d4ff;
  --ok: #00e5a0;
  --warn: #ffaa00;
  --danger: #ff5566;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 "JetBrains Mono", monospace;
}
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 18px;
}
.title {
  font-size: 28px;
  font-weight: 700;
}
.sub {
  color: var(--muted);
  font-size: 12px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.card, .panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.card {
  padding: 16px;
}
.label {
  color: var(--muted);
  font-size: 12px;
}
.value {
  margin-top: 8px;
  font-size: 28px;
  font-weight: 700;
}
.value.small {
  font-size: 22px;
}
.panel {
  padding: 16px;
  margin-bottom: 18px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.panel-title {
  font-size: 18px;
  font-weight: 700;
}
.hint {
  color: var(--muted);
  font-size: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
th {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
tr:last-child td {
  border-bottom: none;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid var(--border);
}
.badge.ok { color: var(--ok); border-color: rgba(0,229,160,.35); }
.badge.warn { color: var(--warn); border-color: rgba(255,170,0,.35); }
.badge.danger { color: var(--danger); border-color: rgba(255,85,102,.35); }
.badge.info { color: var(--accent); border-color: rgba(0,212,255,.35); }
.chart {
  width: 100%;
  min-height: 260px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-2);
  padding: 12px;
}
.empty {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}
.mono {
  font-variant-numeric: tabular-nums;
}
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 640px) {
  .wrap {
    padding: 14px;
  }
  .head {
    flex-direction: column;
    align-items: flex-start;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  .value {
    font-size: 24px;
  }
  table, thead, tbody, th, td, tr {
    display: block;
  }
  thead {
    display: none;
  }
  tr {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 10px;
    padding: 8px;
    background: var(--panel-2);
  }
  td {
    border: none;
    padding: 4px 0;
  }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="title">GPU 计算时门户</div>
        <div class="sub">用户：{{ portal_username }} ·  {{ retention_days }} 天 · v{{ panel_version }}</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">最近30天 GPU卡时</div>
        <div class="value mono" id="ov-hours">—</div>
      </div>
      <div class="card">
        <div class="label">本周已用 / 有效额度</div>
        <div class="value mono" id="ov-rank">—</div>
      </div>
      <div class="card">
        <div class="label">本周超额量</div>
        <div class="value small mono" id="ov-quota">—</div>
      </div>
      <div class="card">
        <div class="label">配额状态</div>
        <div class="value small" id="ov-status">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">用量曲线</div>
          <div class="hint" id="chart-window">—</div>
        </div>
      </div>
      <div id="daily-chart" class="chart"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">最近 30 天用量</div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>排名</th>
            <th>用户</th>
            <th>30天 GPU卡时</th>
            <th>本周已用 / 有效额度</th>
            <th>本周超额量</th>
            <th>低效占用</th>
            <th>平均 GPU%</th>
            <th>峰值活跃 GPU</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </div>
  </div>

<script>
const PORTAL_TOKEN = {{ portal_token|tojson }};

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

function formatHours(value, withUnit = true) {
  const num = Number(value);
  if (!Number.isFinite(num)) return '—';
  const digits = num >= 100 ? 0 : (num >= 10 ? 1 : 2);
  return `${num.toFixed(digits)}${withUnit ? ' h' : ''}`;
}

function formatPercent(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return '—';
  return `${num >= 10 ? num.toFixed(0) : num.toFixed(1)}%`;
}

function quotaBadge(status) {
  const map = {
    normal: ['ok', '正常'],
    warn: ['warn', '预警'],
    over: ['danger', '超额'],
    critical: ['danger', '严重超额']
  };
  const item = map[status] || ['info', status || '未知'];
  return `<span class="badge ${item[0]}">${item[1]}</span>`;
}

async function portalApi(path) {
  const response = await fetch(path);
  return response.json();
}

function renderChart(series, windowStart, windowEnd) {
  const container = document.getElementById('daily-chart');
  document.getElementById('chart-window').textContent = `${windowStart} 至 ${windowEnd}`;
  const points = Array.isArray(series) ? series : [];
  if (!points.length) {
    container.innerHTML = '<div class="empty">暂无最近 30 天曲线数据</div>';
    return;
  }
  const width = 960;
  const height = 260;
  const padding = { top: 16, right: 16, bottom: 28, left: 48 };
  const chartWidth = width - padding.left - padding.right;
  const chartHeight = height - padding.top - padding.bottom;
  const values = points.map(item => Number(item.gpu_card_hours || 0));
  const max = Math.max(...values, 1);
  const step = points.length > 1 ? chartWidth / (points.length - 1) : chartWidth;
  const coords = points.map((item, index) => {
    const value = Number(item.gpu_card_hours || 0);
    return {
      x: padding.left + step * index,
      y: padding.top + chartHeight - (value / max) * chartHeight,
      date: item.date,
      value
    };
  });
  const path = coords.map((point, index) => `${index === 0 ? 'M' : 'L'}${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(' ');
  const area = `${path} L${(padding.left + chartWidth).toFixed(2)} ${(padding.top + chartHeight).toFixed(2)} L${padding.left.toFixed(2)} ${(padding.top + chartHeight).toFixed(2)} Z`;
  const grid = [0, 0.25, 0.5, 0.75, 1].map(ratio => {
    const y = padding.top + chartHeight - chartHeight * ratio;
    return { y, label: (max * ratio).toFixed(max >= 10 ? 0 : 1) };
  });
  const xLabels = coords.filter((_, index) => index === 0 || index === coords.length - 1 || index % 5 === 0);
  container.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="260" preserveAspectRatio="none">
      ${grid.map(line => `
        <line x1="${padding.left}" y1="${line.y.toFixed(2)}" x2="${(padding.left + chartWidth).toFixed(2)}" y2="${line.y.toFixed(2)}" stroke="var(--border)" stroke-width="1"></line>
        <text x="${padding.left - 8}" y="${(line.y + 4).toFixed(2)}" text-anchor="end" fill="var(--low)" font-size="10">${escapeHtml(line.label)}</text>
      `).join('')}
      <path d="${area}" fill="rgba(0,212,255,.12)"></path>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      ${coords.map(point => `
        <circle cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="2.5" fill="var(--accent)">
          <title>${escapeHtml(point.date)}: ${escapeHtml(formatHours(point.value))}</title>
        </circle>
      `).join('')}
      ${xLabels.map(point => `
        <text x="${point.x.toFixed(2)}" y="${height - 8}" text-anchor="middle" fill="var(--low)" font-size="10">${escapeHtml(point.date.slice(5))}</text>
      `).join('')}
    </svg>
  `;
}

function renderRanking(ranking) {
  const tbody = document.getElementById('ranking-body');
  const rows = Array.isArray(ranking) ? ranking : [];
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8">暂无排名数据</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(item => `
    <tr>
      <td class="mono">#${escapeHtml(String(item.rank || '—'))}</td>
      <td>${escapeHtml(item.display_name || '—')}${item.is_self ? ' <span class="badge info">本人</span>' : ''}</td>
      <td class="mono">${escapeHtml(formatHours(item.gpu_card_hours))}</td>
      <td class="mono">${escapeHtml(formatHours(item.weekly_gpu_card_hours || 0))} / ${escapeHtml(formatHours(item.effective_quota_hours || 0))}</td>
      <td class="mono">${escapeHtml(formatHours(item.weekly_over_quota_hours || 0))}</td>
      <td class="mono">${escapeHtml(formatHours(item.low_efficiency_card_hours))}</td>
      <td class="mono">${escapeHtml(formatPercent(item.avg_gpu_util_percent || 0))}</td>
      <td class="mono">${escapeHtml(String(item.peak_active_gpu_count || 0))}</td>
    </tr>
  `).join('');
}

async function loadPortal() {
  const [me, ranking] = await Promise.all([
    portalApi(`/portal-api/me/${encodeURIComponent(PORTAL_TOKEN)}?days=30`),
    portalApi(`/portal-api/ranking/${encodeURIComponent(PORTAL_TOKEN)}?days=30`)
  ]);
  if (!me.ok) {
    document.body.innerHTML = `<div class="wrap"><div class="panel"><div class="empty">${escapeHtml(me.error || '读取失败')}</div></div></div>`;
    return;
  }
  document.getElementById('ov-hours').textContent = formatHours(me.me.gpu_card_hours || 0, false);
  document.getElementById('ov-rank').textContent = `${formatHours(me.me.weekly_gpu_card_hours || 0)} / ${formatHours(me.me.effective_quota_hours || 0)}`;
  document.getElementById('ov-quota').textContent = formatHours(me.me.weekly_over_quota_hours || 0);
  document.getElementById('ov-status').innerHTML = quotaBadge(me.me.quota_status);
  renderChart((me.daily && me.daily.series) || [], me.window_start, me.window_end);
  renderRanking((ranking && ranking.ranking) || []);
}

loadPortal();
</script>
</body>
</html>
